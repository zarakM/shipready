# A finished pod on big-idle: its requests no longer count against the node.
apiVersion: v1
kind: Pod
metadata:
  name: done-job
  namespace: shop
spec:
  nodeName: big-idle
  containers:
    - name: job
      image: registry.example.com/job:0.1.0
      resources:
        requests:
          cpu: "3"
          memory: 12Gi
status:
  phase: Succeeded
