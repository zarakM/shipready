# Problems for COST-001 to COST-004. Clock fixed at 2026-11-16T12:00:00Z.
#
# Node "big-idle" has 4 CPU / 16Gi and carries 250m / 576Mi of requests.
# Node "busy" has 4 CPU / 16Gi and carries 4000m / 3Gi of requests.
apiVersion: v1
kind: Node
metadata:
  name: big-idle
status:
  allocatable:
    cpu: "4"
    memory: 16Gi
---
apiVersion: v1
kind: Node
metadata:
  name: busy
status:
  allocatable:
    cpu: "4"
    memory: 16Gi
---
# Requests 3 CPU and uses 150m: far over-provisioned on CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
---
apiVersion: v1
kind: Pod
metadata:
  name: api-1
  namespace: shop
  labels:
    app: api
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: api-5c9d
      uid: 00000000-0000-0000-0000-000000000001
spec:
  nodeName: busy
  containers:
    - name: api
      image: registry.example.com/api:1.4.2
      resources:
        requests:
          cpu: "3"
          memory: 2Gi
status:
  phase: Running
  startTime: "2026-11-16T08:00:00Z"
---
apiVersion: metrics.k8s.io/v1beta1
kind: PodMetrics
metadata:
  name: api-1
  namespace: shop
containers:
  - name: api
    usage:
      cpu: 150m
      memory: 1500Mi
---
# Sized sensibly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-1
  namespace: shop
  labels:
    app: frontend
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: frontend-7b6f
      uid: 00000000-0000-0000-0000-000000000002
spec:
  nodeName: big-idle
  containers:
    - name: frontend
      image: registry.example.com/frontend:3.1.0
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
status:
  phase: Running
  startTime: "2026-11-16T08:00:00Z"
---
apiVersion: metrics.k8s.io/v1beta1
kind: PodMetrics
metadata:
  name: frontend-1
  namespace: shop
containers:
  - name: frontend
    usage:
      cpu: 120m
      memory: 400Mi
---
# Barely used, but its requests are too small to be worth flagging.
