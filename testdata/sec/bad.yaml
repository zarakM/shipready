# Problems for SEC-001 to SEC-008. The "shop" namespace holds the problems;
# "billing" is set up correctly and must produce no findings.
apiVersion: v1
kind: Node
metadata:
  name: public-node
status:
  addresses:
    - type: InternalIP
      address: 10.0.1.15
    - type: ExternalIP
      address: 203.0.113.10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: shop
spec:
  replicas: 2
  template:
    spec:
      hostNetwork: true
      volumes:
        - name: docker
          hostPath:
            path: /var/run/docker.sock
      initContainers:
        - name: init-perms
          image: busybox:1.36
          securityContext:
            runAsUser: 0
      containers:
        # No security context, and secrets passed as plain values.
        - name: storefront
          image: registry.example.com/storefront:2.0.0
          env:
            - name: DB_PASSWORD
              value: not-a-real-password
            - name: API_TOKEN
              value: not-a-real-token
            # Not secrets: a path, and a reference to another variable.
            - name: TOKEN_FILE
              value: /var/run/secrets/token
            - name: LOG_LEVEL
              value: info
        - name: sidecar
          image: registry.example.com/sidecar:1.0.0
          securityContext:
            privileged: true
---
# Hardened: explicit non-root, its own ServiceAccount, secret from a reference.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe
  namespace: shop
spec:
  replicas: 2
  template:
    spec:
      serviceAccountName: safe
      securityContext:
        runAsNonRoot: true
      containers:
        - name: safe
          image: registry.example.com/safe:1.0.0
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoices
  namespace: billing
spec:
  replicas: 2
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
      containers:
        - name: invoices
          image: registry.example.com/invoices:1.0.0
---
# Uses the default ServiceAccount, but that account has token mounting off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: billing
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: batch
          image: registry.example.com/batch:1.0.0
          securityContext:
            runAsNonRoot: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: billing
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: shop
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: billing
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: User
    name: alice@example.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: everyone-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: system:authenticated
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: ci
---
# The built-in binding: system subject, exempt.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: system:masters
---
# A kube-system ServiceAccount and an EKS-managed identity: both exempt.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: addon-installer
    namespace: kube-system
  - kind: User
    name: eks:addon-manager
---
# Not cluster-admin: ignored.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: viewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: User
    name: bob@example.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: do-anything
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
# Built-in roles are exempt, by label and by name prefix.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-admin
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:controller:example
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wild-reader
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: v1
kind: Service
metadata:
  name: public-lb
  namespace: shop
spec:
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: internal-lb
  namespace: shop
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
spec:
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: restricted-lb
  namespace: shop
spec:
  type: LoadBalancer
  loadBalancerSourceRanges: ["198.51.100.0/24"]
---
# AWS Load Balancer Controller NLBs are internal unless marked internet-facing.
apiVersion: v1
kind: Service
metadata:
  name: controller-nlb
  namespace: shop
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
---
apiVersion: v1
kind: Service
metadata:
  name: nodeport
  namespace: shop
spec:
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: internal
  namespace: shop
spec:
  type: ClusterIP
