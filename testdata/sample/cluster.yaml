containers:
  - name: api
    usage: {cpu: 640m, memory: 2100Mi}
---
apiVersion: metrics.k8s.io/v1beta1
kind: PodMetrics
metadata: {name: api-6d8f7c9b5-m7q9z, namespace: prod}
containers:
  - name: api
    usage: {cpu: 580m, memory: 2050Mi}
---
# Two replicas but no budget and no autoscaler, the default ServiceAccount,
# and a payment key written into the manifest.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: prod}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: web
          image: 482917365104.dkr.ecr.us-east-1.amazonaws.com/web:5.3.0
          env:
            - {name: STRIPE_API_KEY, value: placeholder-not-a-real-key}
            - {name: API_URL, value: "http://api.prod.svc:8080"}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {memory: 512Mi}
          readinessProbe: {httpGet: {path: /, port: 3000}}
          livenessProbe: {httpGet: {path: /, port: 3000}}
---
# One replica, latest tag, no memory limit, no liveness probe.
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      serviceAccountName: worker
      securityContext: {runAsNonRoot: true}
      containers:
        - name: worker
          image: 482917365104.dkr.ecr.us-east-1.amazonaws.com/worker:latest
          resources:
            requests: {cpu: 250m, memory: 512Mi}
          readinessProbe: {exec: {command: ["/bin/healthcheck"]}}
---
# The database: single replica, and no backup covers its volume.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: prod}
spec:
  replicas: 1
  serviceName: postgres
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      serviceAccountName: postgres
      securityContext: {runAsNonRoot: true, runAsUser: 999}
      containers:
        - name: postgres
          image: postgres:16.4
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
          readinessProbe: {exec: {command: ["pg_isready"]}}
          livenessProbe: {exec: {command: ["pg_isready"]}}
  volumeClaimTemplates:
    - metadata: {name: data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data-postgres-0, namespace: prod}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: staging}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      serviceAccountName: api
      securityContext: {runAsNonRoot: true}
      containers:
        - name: api
          image: 482917365104.dkr.ecr.us-east-1.amazonaws.com/api:2.15.0-rc1
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /livez, port: 8080}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: log-agent, namespace: monitoring}
spec:
  selector: {matchLabels: {app: log-agent}}
  template:
    metadata: {labels: {app: log-agent}}
    spec:
      serviceAccountName: log-agent
      securityContext: {runAsNonRoot: true}
      containers:
        - name: agent
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:2.32.4
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          livenessProbe: {httpGet: {path: /api/v1/health, port: 2020}}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: prod
  annotations: {service.beta.kubernetes.io/aws-load-balancer-scheme: internal}
spec: {type: LoadBalancer}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: prod}
spec: {type: ClusterIP}
