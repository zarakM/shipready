apiVersion: velero.io/v1
kind: Backup
metadata: {name: daily-20261116020000, namespace: velero}
status:
  phase: Completed
  completionTimestamp: "2026-11-16T02:07:41Z"
---
# Backs up only what is labelled for it, and the database is not.
apiVersion: velero.io/v1
kind: Schedule
metadata: {name: daily, namespace: velero}
spec:
  schedule: "0 2 * * *"
  template:
    includedNamespaces: ["*"]
    labelSelector:
