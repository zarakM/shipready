# The well-run service: replicas, budget, autoscaler, probes, limits.
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: prod}
spec:
  replicas: 3
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      serviceAccountName: api
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: 482917365104.dkr.ecr.us-east-1.amazonaws.com/api:2.14.1
          resources:
            requests: {cpu: "1", memory: 3Gi}
            limits: {memory: 4Gi}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /livez, port: 8080}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: prod}
spec:
  maxUnavailable: 1
  selector: {matchLabels: {app: api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 3
  maxReplicas: 12
---
apiVersion: v1
kind: Pod
metadata:
  name: api-6d8f7c9b5-x2k4p
  namespace: prod
  labels: {app: api}
  ownerReferences:
    - {apiVersion: apps/v1, kind: ReplicaSet, name: api-6d8f7c9b5, uid: 00000000-0000-0000-0000-0000000000a1}
spec:
  nodeName: ip-10-0-1-21.ec2.internal
  containers:
    - name: api
      image: 482917365104.dkr.ecr.us-east-1.amazonaws.com/api:2.14.1
      resources:
        requests: {cpu: "1", memory: 3Gi}
status: {phase: Running, startTime: "2026-11-14T09:00:00Z"}
---
apiVersion: v1
kind: Pod
metadata:
  name: api-6d8f7c9b5-m7q9z
  namespace: prod
  labels: {app: api}
  ownerReferences:
    - {apiVersion: apps/v1, kind: ReplicaSet, name: api-6d8f7c9b5, uid: 00000000-0000-0000-0000-0000000000a1}
spec:
  nodeName: ip-10-0-2-47.ec2.internal
  containers:
    - name: api
      image: 482917365104.dkr.ecr.us-east-1.amazonaws.com/api:2.14.1
